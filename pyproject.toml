[project]
name = "lending-library"
version = "0.1.0"
description = "A small book-lending library service (FastAPI + SQLite)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143,<0.144",
    "pydantic>=2.11",
    "uvicorn>=0.34",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.13",
    "mutmut>=3.3",
    "mypy>=1.15",
    "pytest>=8.3",
    "pytest-timeout>=2.3",
    "ruff>=0.11",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
timeout = 60
xfail_strict = true

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["mutants"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "RUF", "TID"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"datetime.datetime.now".msg = "Take time from the injected Clock (app.clock), see AGENTS.md E-006."
"datetime.datetime.utcnow".msg = "Take time from the injected Clock (app.clock), see AGENTS.md E-006."
"datetime.date.today".msg = "Take time from the injected Clock (app.clock), see AGENTS.md E-006."
"time.time".msg = "Take time from the injected Clock (app.clock), see AGENTS.md E-006."

[tool.ruff.lint.per-file-ignores]
"app/clock.py" = ["TID251"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.mutmut]
source_paths = ["app/"]
pytest_add_cli_args_test_selection = ["tests/"]
